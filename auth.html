<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship &mdash; Authenticate</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'%3E%3Crect width='9' height='9' fill='%230b1b3a'/%3E%3Cg fill='%23fff'%3E%3Cpath d='M1 1h3v3H1z M5 1h3v3H5z M1 5h3v3H1z'/%3E%3C/g%3E%3Cg fill='%230b1b3a'%3E%3Cpath d='M2 2h1v1H2z M6 2h1v1H6z M2 6h1v1H2z'/%3E%3C/g%3E%3Crect x='5' y='5' width='1' height='1' fill='%23fff'/%3E%3Crect x='7' y='7' width='1' height='1' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <h1>Authenticate</h1>
    </header>

    <main>
        <section class="card">
            <div class="actions">
                <button type="button" id="start-scan" class="btn-auth">Start scanning</button>
                <button type="button" id="manage-license" class="btn-show">Manage license</button>
            </div>
            <p id="status" class="status"></p>
        </section>

        <!-- Camera. Released the moment a code is read. -->
        <section id="scanner-panel" class="card" hidden>
            <div class="video-box">
                <video id="scanner-video" playsinline muted></video>
            </div>
            <button type="button" id="camera-control" class="ghost">Stop scan / Change camera</button>
        </section>

        <section class="card">
            <h2>Scanned</h2>
            <div id="inputdiv" class="value"></div>

            <h2>Result</h2>
            <!-- window.start() writes here, asynchronously. -->
            <div id="result" class="value"></div>
        </section>

        <div id="result-qr" class="card qr-box" hidden></div>
    </main>

    <script src="js/qrcode.js"></script>
    <script src="js/qrcode_UTF8.js"></script>
    <script src="js/jsQR.js"></script>

    <!-- window.start() is yours: it already exists and writes into #result.
         Load it here, before auth.js runs. -->
    <!-- <script src="js/start.js"></script> -->

    <script type="module" src="js/auth.js"></script>
</body>
</html>
